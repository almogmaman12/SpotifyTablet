<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0A0B0E">
<title>Tablet remote</title>
<style>
  :root { --bg:#0A0B0E; --card:#14171d; --line:#232833; --text:#fff; --dim:#9AA3B2; --accent:#1DB954; --danger:#ff6b6b; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:16px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  body { padding: env(safe-area-inset-top) 16px calc(24px + env(safe-area-inset-bottom)); max-width: 560px; margin: 0 auto; }
  header { display:flex; align-items:center; gap:10px; padding:16px 0 8px; }
  header h1 { font-size:20px; margin:0; font-weight:600; flex:1; }
  .dot { width:10px; height:10px; border-radius:50%; background:#5b6270; }
  .dot.on { background:var(--accent); } .dot.off { background:var(--danger); }
  nav { display:flex; gap:8px; margin:8px 0 16px; }
  nav button { flex:1; padding:11px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--dim); font-size:15px; font-weight:600; }
  nav button.on { background:var(--accent); border-color:var(--accent); color:#000; }
  .banner { background:#3a1f1f; color:#ffb4b4; border-radius:12px; padding:10px 14px; margin-bottom:12px; font-size:14px; }
  .hidden { display:none !important; }
  /* login */
  .login { margin-top:40px; text-align:center; }
  .login p { color:var(--dim); }
  .login input { width:100%; padding:14px; border-radius:12px; border:1px solid var(--line); background:var(--card); color:var(--text); font-size:20px; text-align:center; letter-spacing:.15em; text-transform:lowercase; }
  .login button { margin-top:12px; width:100%; padding:14px; border:0; border-radius:12px; background:var(--accent); color:#000; font-size:16px; font-weight:700; }
  .err { color:var(--danger); min-height:1.4em; margin-top:10px; }
  /* player */
  .now { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; }
  .cover { width:100%; aspect-ratio:1/1; border-radius:14px; background:#0d0f13 center/cover no-repeat; overflow:hidden; }
  .cover img { width:100%; height:100%; object-fit:cover; display:block; }
  .cover.wide { aspect-ratio:16/9; }
  .titles { margin:14px 2px 4px; text-align:center; }
  .title { font-size:20px; font-weight:700; overflow-wrap:anywhere; }
  .artist { color:var(--dim); margin-top:2px; overflow-wrap:anywhere; }
  .chip { display:inline-block; margin-top:8px; padding:3px 10px; border-radius:999px; border:1px solid var(--line); color:var(--dim); font-size:12px; text-transform:capitalize; }
  .idle { text-align:center; color:var(--dim); padding:36px 0; }
  .bar { display:flex; align-items:center; gap:10px; margin:14px 0 6px; color:var(--dim); font-size:13px; font-variant-numeric:tabular-nums; }
  input[type=range] { -webkit-appearance:none; appearance:none; flex:1; height:6px; border-radius:3px; background:#2a303c; outline:none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:20px; height:20px; border-radius:50%; background:var(--accent); }
  input[type=range]::-moz-range-thumb { width:20px; height:20px; border:0; border-radius:50%; background:var(--accent); }
  .controls { display:flex; justify-content:center; align-items:center; gap:14px; margin-top:12px; }
  .controls button { width:56px; height:56px; border-radius:50%; border:1px solid var(--line); background:#1b2029; color:var(--text); font-size:22px; }
  .controls button.big { width:72px; height:72px; background:var(--accent); border-color:var(--accent); color:#000; font-size:28px; }
  .controls button:active { transform:scale(.96); }
  .vol { display:flex; justify-content:center; gap:12px; margin-top:16px; align-items:center; color:var(--dim); font-size:14px; }
  .vol button { padding:9px 18px; border-radius:12px; border:1px solid var(--line); background:#1b2029; color:var(--text); font-size:15px; }
  /* settings */
  h3 { font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); margin:22px 4px 8px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; overflow:hidden; }
  .row { display:flex; align-items:center; gap:12px; padding:13px 16px; border-top:1px solid var(--line); }
  .row:first-child { border-top:0; }
  .row .txt { flex:1; min-width:0; }
  .row .lbl { font-size:15px; }
  .row .help { color:var(--dim); font-size:12.5px; margin-top:2px; }
  .row.col { flex-direction:column; align-items:stretch; gap:8px; }
  .row.col input[type=range] { flex:none; margin:10px 0 4px; }
  .row.col .top { display:flex; gap:12px; align-items:center; }
  .row .val { color:var(--accent); font-weight:700; font-size:14px; font-variant-numeric:tabular-nums; }
  select { max-width:55%; padding:9px 10px; border-radius:10px; border:1px solid var(--line); background:#1b2029; color:var(--text); font-size:14px; }
  .sw { position:relative; width:48px; height:28px; flex:none; }
  .sw input { opacity:0; width:100%; height:100%; margin:0; position:absolute; inset:0; z-index:2; }
  .sw span { position:absolute; inset:0; border-radius:14px; background:#2a303c; transition:.15s; }
  .sw span::after { content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%; background:#fff; transition:.15s; }
  .sw input:checked + span { background:var(--accent); }
  .sw input:checked + span::after { transform:translateX(20px); }
  #toast { position:fixed; left:50%; bottom:calc(24px + env(safe-area-inset-bottom)); transform:translate(-50%, 20px); background:#222833; color:#fff; padding:10px 18px; border-radius:999px; opacity:0; transition:.2s; pointer-events:none; font-size:14px; }
  #toast.show { opacity:1; transform:translate(-50%, 0); }
</style>
</head>
<body>
<header><h1>Tablet remote</h1><div id="dot" class="dot" title="Connection"></div></header>

<div id="loginView" class="login hidden">
  <p>Enter the code shown in the tablet's Settings, under Playback, Phone control page.</p>
  <input id="code" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="16" placeholder="code">
  <button id="loginBtn">Connect</button>
  <div id="loginErr" class="err"></div>
</div>

<div id="appView" class="hidden">
  <div id="banner" class="banner hidden"></div>
  <nav><button id="tabPlayer" class="on">Player</button><button id="tabSettings">Settings</button></nav>

  <section id="player">
    <div class="now">
      <div id="idle" class="idle hidden">Nothing is playing right now.</div>
      <div id="playing" class="hidden">
        <div id="coverBox" class="cover"><img id="cover" alt=""></div>
        <div class="titles">
          <div id="title" class="title"></div>
          <div id="artist" class="artist"></div>
          <div id="source" class="chip"></div>
        </div>
        <div class="bar"><span id="pos">0:00</span><input id="seek" type="range" min="0" max="1000" value="0"><span id="dur">0:00</span></div>
        <div class="controls">
          <button id="prev" aria-label="Previous">&#9198;&#xFE0E;</button>
          <button id="play" class="big" aria-label="Play or pause">&#9654;&#xFE0E;</button>
          <button id="next" aria-label="Next">&#9197;&#xFE0E;</button>
        </div>
        <div id="volBox" class="vol"><button id="volDown">Vol &minus;</button><span id="volVal"></span><button id="volUp">Vol +</button></div>
      </div>
    </div>
  </section>

  <section id="settings" class="hidden"><div id="settingsBody"></div></section>
</div>
<div id="toast"></div>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var token = "";
  try { token = localStorage.getItem("tabletToken") || ""; } catch (e) {}
  var q = new URLSearchParams(location.search);
  if (q.get("code")) {
    token = q.get("code").trim().toLowerCase();
    try { localStorage.setItem("tabletToken", token); } catch (e) {}
    history.replaceState(null, "", location.pathname);
  }

  function toast(text) {
    var t = $("toast"); t.textContent = text; t.classList.add("show");
    clearTimeout(toast.h); toast.h = setTimeout(function () { t.classList.remove("show"); }, 1400);
  }

  function api(path, body) {
    var opts = { headers: { "X-Token": token } };
    if (body) { opts.method = "POST"; opts.body = JSON.stringify(body); opts.headers["Content-Type"] = "text/plain"; }
    return fetch(path, opts).then(function (res) {
      if (res.status === 401) { var e = new Error("auth"); e.auth = true; throw e; }
      return res.json().then(function (j) { if (!res.ok) { var e2 = new Error(j.error || "error"); e2.status = res.status; e2.json = j; throw e2; } return j; });
    });
  }

  // ---- login ----
  function showLogin(message) {
    $("appView").classList.add("hidden"); $("loginView").classList.remove("hidden");
    $("loginErr").textContent = message || ""; running = false;
  }
  $("loginBtn").onclick = function () {
    token = $("code").value.trim().toLowerCase();
    try { localStorage.setItem("tabletToken", token); } catch (e) {}
    start();
  };
  $("code").addEventListener("keydown", function (e) { if (e.key === "Enter") $("loginBtn").click(); });

  // ---- tabs ----
  function tab(name) {
    $("player").classList.toggle("hidden", name !== "player");
    $("settings").classList.toggle("hidden", name !== "settings");
    $("tabPlayer").classList.toggle("on", name === "player");
    $("tabSettings").classList.toggle("on", name === "settings");
    if (name === "settings") loadSettings();
  }
  $("tabPlayer").onclick = function () { tab("player"); };
  $("tabSettings").onclick = function () { tab("settings"); };

  // ---- player ----
  var base = { pos: 0, at: 0, playing: false, dur: 0 };
  var dragging = false, lastCover = "";
  function fmt(ms) { var s = Math.max(0, Math.round(ms / 1000)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0"); }

  function render(st) {
    var idle = !!st.idle || !st.title;
    $("idle").classList.toggle("hidden", !idle);
    $("playing").classList.toggle("hidden", idle);
    if (idle) return;
    $("title").textContent = st.title; $("artist").textContent = st.artist || "";
    $("source").textContent = st.source || ""; $("source").classList.toggle("hidden", !st.source);
    $("play").innerHTML = st.playing ? "&#9208;&#xFE0E;" : "&#9654;&#xFE0E;";
    $("volBox").classList.toggle("hidden", !st.canVolume);
    $("volVal").textContent = st.volume >= 0 ? st.volume + "%" : "";
    base = { pos: st.positionMs, at: performance.now(), playing: st.playing, dur: st.durationMs };
    $("dur").textContent = fmt(st.durationMs);
    if (st.cover && st.cover !== lastCover) {
      lastCover = st.cover;
      var src = st.cover.indexOf("/api/cover") === 0 ? st.cover + "&t=" + encodeURIComponent(token) : st.cover;
      var img = $("cover");
      img.onload = function () { $("coverBox").classList.remove("hidden"); $("coverBox").classList.toggle("wide", img.naturalWidth / img.naturalHeight >= 1.3); };
      img.onerror = function () { $("coverBox").classList.add("hidden"); };
      img.src = src;
    }
    tick();
  }

  function tick() {
    if (dragging || !base.dur) return;
    var pos = base.pos + (base.playing ? performance.now() - base.at : 0);
    pos = Math.min(pos, base.dur);
    $("pos").textContent = fmt(pos);
    $("seek").value = Math.round(pos / base.dur * 1000);
  }
  setInterval(tick, 250);

  var seek = $("seek");
  seek.addEventListener("input", function () { dragging = true; $("pos").textContent = fmt(seek.value / 1000 * base.dur); });
  seek.addEventListener("change", function () {
    var ms = Math.round(seek.value / 1000 * base.dur);
    base.pos = ms; base.at = performance.now();
    cmd("seek", ms); dragging = false;
  });

  function cmd(c, ms) {
    api("/api/command", { c: c, ms: ms || 0 }).then(function () { setTimeout(poll1, 350); })
      .catch(function (e) { if (e.auth) showLogin("Wrong code"); else toast(e.message || "Failed"); });
  }
  $("play").onclick = function () { cmd("playpause"); };
  $("prev").onclick = function () { cmd("previous"); };
  $("next").onclick = function () { cmd("next"); };
  $("volUp").onclick = function () { cmd("volup"); };
  $("volDown").onclick = function () { cmd("voldown"); };

  // ---- polling ----
  var running = false, offline = 0;
  function banner(text) { var b = $("banner"); b.textContent = text || ""; b.classList.toggle("hidden", !text); }
  function setDot(cls) { $("dot").className = "dot " + cls; }

  function poll1() {
    return api("/api/state").then(function (st) {
      offline = 0; setDot("on"); banner(""); render(st);
    }).catch(function (e) {
      if (e.auth) { showLogin("Wrong code"); return; }
      if (e.status === 403) { setDot("off"); banner(e.message); return; }
      if (++offline >= 2) { setDot("off"); banner("Can't reach the tablet. Same Wi-Fi? Is the page still switched on in its Settings?"); }
    });
  }
  function loop() {
    if (!running) return;
    var done = document.hidden ? Promise.resolve() : poll1();
    done.then(function () { setTimeout(loop, document.hidden ? 3000 : 1000); });
  }
  function start() {
    if (!token) { showLogin(""); return; }
    $("loginView").classList.add("hidden"); $("appView").classList.remove("hidden");
    if (!running) { running = true; loop(); }
  }

  // ---- settings ----
  var settingsLoaded = false;
  function loadSettings() {
    if (settingsLoaded) return;
    api("/api/settings").then(function (j) { settingsLoaded = true; renderSettings(j.groups); })
      .catch(function (e) { if (e.auth) showLogin("Wrong code"); else $("settingsBody").textContent = e.message; });
  }
  function save(key, value, label) {
    api("/api/settings", { key: key, value: value }).then(function () { toast("Saved: " + label); })
      .catch(function (e) { toast(e.message || "Failed"); });
  }
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }

  function renderSettings(groups) {
    var body = $("settingsBody"); body.textContent = "";
    groups.forEach(function (g) {
      body.appendChild(el("h3", null, g.label));
      var card = el("div", "card");
      g.items.forEach(function (s) {
        var row = el("div", "row" + (s.kind === "int" ? " col" : ""));
        var txt = el("div", "txt"); txt.appendChild(el("div", "lbl", s.label));
        if (s.help) txt.appendChild(el("div", "help", s.help));
        if (s.kind === "bool") {
          var sw = el("label", "sw"), cb = el("input"); cb.type = "checkbox"; cb.checked = !!s.value;
          cb.onchange = function () { save(s.key, cb.checked, s.label); };
          sw.appendChild(cb); sw.appendChild(el("span"));
          row.appendChild(txt); row.appendChild(sw);
        } else if (s.kind === "choice") {
          var sel = el("select");
          s.options.forEach(function (o) { var op = el("option", null, o.l); op.value = o.v; if (o.v === s.value) op.selected = true; sel.appendChild(op); });
          sel.onchange = function () { save(s.key, sel.value, s.label); };
          row.appendChild(txt); row.appendChild(sel);
        } else {
          var top = el("div", "top"), val = el("div", "val");
          var show = function (v) { val.textContent = (v > 0 && s.min < 0 ? "+" : "") + v + s.unit; };
          show(s.value); top.appendChild(txt); top.appendChild(val); row.appendChild(top);
          var r = el("input"); r.type = "range"; r.min = s.min; r.max = s.max; r.step = s.step; r.value = s.value;
          r.oninput = function () { show(+r.value); };
          r.onchange = function () { save(s.key, +r.value, s.label); };
          row.appendChild(r);
        }
        card.appendChild(row);
      });
      body.appendChild(card);
    });
  }

  start();
})();
</script>
</body>
</html>
